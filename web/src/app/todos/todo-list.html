<form (submit)="add($event)">
  <input
    data-testid="new-todo-title"
    aria-label="New todo"
    [value]="newTitle()"
    (input)="titleEdited($any($event.target).value)"
  />
  <button type="submit" data-testid="add-todo">Add</button>
</form>

@if (showTitleTooLongWarning()) {
  <p data-testid="title-too-long-warning" role="status">The title is too long</p>
}

@if (error(); as message) {
  <p data-testid="error-message" role="alert">{{ message }}</p>
}

<ul>
  @for (todo of todos(); track todo.id) {
    <li data-testid="todo-item" [attr.data-completed]="todo.completed">
      <span data-testid="todo-title">{{ todo.title }}</span>
    </li>
  }
</ul>
